# Temporary: runs the site build once so the error log can be read. Branch is deleted afterwards.
name: Build check
on:
  push:
    branches: [ci-build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx --yes wrangler@4 deploy --dry-run --env dev --outdir /tmp/wrangler-out
